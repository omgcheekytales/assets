name: Actualizar game-icons

on:
  schedule:
    - cron: "0 6 1 * *"   # el dia 1 de cada mes a las 06:00 UTC
  workflow_dispatch:       # permite lanzarlo a mano desde la pestana Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar tu repositorio
        uses: actions/checkout@v4

      - name: Descargar los iconos oficiales
        uses: actions/checkout@v4
        with:
          repository: game-icons/icons
          path: _icons-src

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramientas de fuentes
        run: pip install fonttools brotli

      - name: Generar la fuente
        run: python tools/game-icons/build_font.py _icons-src game-icons

      - name: Guardar cambios si los hay
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-icons tools/game-icons/names.json tools/game-icons/codepoints.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No hay iconos nuevos."
          else
            git commit -m "Actualizar game-icons"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refrescar la cache de jsDelivr
        if: steps.commit.outputs.changed == 'true'
        run: |
          for f in css ttf woff woff2; do
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/game-icons/game-icons.$f" || true
          done
